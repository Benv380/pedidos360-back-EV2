# Cluster de 2 nodos con descubrimiento estatico (classic_config).
# Al arrancar por primera vez, cada nodo se une a los nodos listados.
# Ambos nodos comparten la misma Erlang cookie (ver docker-compose.yml).
cluster_name = pedidos360-cluster
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Metricas: muestreo cada 1 s (por defecto 5 s) para ver pendientes, consumidores y tasas casi en
# tiempo real en la consola y en el monitor. Costo: algo mas de CPU en el broker.
collect_statistics_interval = 1000

# Proteccion del broker: si la memoria supera el 60 % de la disponible o el disco libre baja de 1 GB,
# RabbitMQ bloquea a los productores (flow control) hasta recuperarse.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
