# Punto de entrada único del backend en la VM (puerto 8080).
# Azure API Management usa esta URL como backend: http://<IP-VM>:8080
# El header Authorization (JWT) se reenvía tal cual a los microservicios.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    client_max_body_size 1m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/pedidos {
        set $destino http://pedidos-service:8081;
        proxy_pass $destino;
    }

    location /api/notificaciones {
        set $destino http://notificaciones-service:8082;
        proxy_pass $destino;
    }

    location /api/auditoria {
        set $destino http://notificaciones-service:8082;
        proxy_pass $destino;
    }

    location /api/documentos {
        set $destino http://documentos-service:8083;
        proxy_pass $destino;
    }

    location /api/admin/rabbit {
        set $destino http://rabbit-admin-service:8084;
        proxy_pass $destino;
    }

    location / {
        default_type application/json;
        return 404 '{"status":404,"detail":"Ruta no encontrada en el gateway"}';
    }
}
